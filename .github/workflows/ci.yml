name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Shared contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify frontend/backend enums are in sync
        run: node scripts/sync-shared.mjs --check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (lint · build · test · coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # The coverage thresholds live in `vitest.config.ts`; this run fails the
      # build if any of them is missed.
      - run: npm run test:coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_min_32_characters_long
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 7

  frontend:
    name: Frontend (lint · build · test · coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:contract
      - run: npm run check:tokens
      - run: npm run check:emoji
      - run: npm run typecheck
      # The suite was green locally and ungated in CI; a design-system refactor
      # is exactly the change that needs it run on every push.
      - run: npm run test:coverage
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com/api
          VITE_SITE_URL: https://kadambastudio.com
      # A build that grows is not a build that breaks, it is a build that gets
      # slower for every visitor until someone notices.
      - run: npm run check:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  e2e:
    name: Browser journeys (Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com/api
          VITE_SITE_URL: https://kadambastudio.com
      # The journeys, the accessibility scan and the visual regression all run
      # here. The visual baselines are Chromium-on-Linux, which is this runner.
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-diffs
          path: frontend/test-results
          retention-days: 7

  lighthouse:
    name: Performance budget (Lighthouse)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.com/api
          VITE_SITE_URL: https://kadambastudio.com
      # The thresholds are in `lighthouserc.cjs`. A regression in performance,
      # accessibility or SEO fails the build.
      - run: npm run check:lighthouse
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          retention-days: 7
