<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#faf7f1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/syne-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/cormorant-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/cormorant-latin-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Two families, with a job each.

      Cormorant Garamond is the editorial voice: the public site's display
      headings, the wordmark, the pull-quotes. Syne is the working voice: body
      copy, controls, and the whole console and portal. Both are self-hosted
      through @fontsource (see main.tsx) so the first paint never waits on a
      third-party font origin.
    -->
    <title data-static>Kadamba's Designer Studio | Kurnool — Traditional &amp; Bridal Wear</title>
    <meta
      data-static
      name="description"
      content="Kadamba's Designer Studio in Kurnool is a well-known local boutique and tailoring business specializing in women's traditional and bridal wear."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
